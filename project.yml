name: AndroidMac
options:
  bundleIdPrefix: com.antigravity
targets:
  AndroidMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources: [AndroidMac]
    settings:
      base:
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Antigravity"
        INFOPLIST_KEY_NSPrincipalClass: "NSApplication"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
