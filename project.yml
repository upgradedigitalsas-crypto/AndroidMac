name: AndroidMac
options:
  bundleIdPrefix: com.antigravity
  deploymentTarget:
    macOS: "14.0"
targets:
  AndroidMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources: [AndroidMac]
    settings:
      base:
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1.1"
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Antigravity"
        INFOPLIST_KEY_NSPrincipalClass: "NSApplication"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        INFOPLIST_KEY_NSCameraUsageDescription: "AndroidMac routes a real webcam into the Android emulator's camera apps when you pick one in Camera source…"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "AndroidMac routes your microphone into the Android emulator when an app records audio."
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
